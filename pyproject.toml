[project]
name = "litharness-contracts"
version = "0.1.0"
description = "Neutral, versioned contracts and golden fixtures shared by the LitHarness research incubators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litharness_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
